# xmall のローカル Supabase 設定
# 使うもの：DB、Auth（メール＋パスワード、Google）、Storage（商品画像・favicon）、ローカルのテスト用メール（Mailpit）。
# major_version は書かない（CLI ごとの既定バージョンを使う。migration は PG15 以降で動く）。
# ポートは 553xx（別プロジェクトの Supabase が既定の 543xx を使っているため）。
# 詳細：https://supabase.com/docs/guides/local-development/cli/config

project_id = "xmall"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

# ローカルで送られた確認メールは http://127.0.0.1:55324 で読める
[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Google ログイン：Google Cloud で OAuth クライアントを作り、.env に
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET を入れてから enabled = true にする。
# リダイレクト URI は http://127.0.0.1:55321/auth/v1/callback
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[storage]
enabled = true
file_size_limit = "10MiB"

# 商品画像・favicon・その他の画像（公開読み取り。書き込みはサーバーの service role のみ）
[storage.buckets.media]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/svg+xml", "image/x-icon", "image/vnd.microsoft.icon"]

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
