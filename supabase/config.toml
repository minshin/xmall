# xmall のローカル Supabase 設定（最小構成）
# DB だけを使うので、新旧どの CLI でも読めるキーだけにしている。
# major_version は書かない（CLI ごとの既定バージョンを使う。migration は PG15 以降で動く）。
# 詳細：https://supabase.com/docs/guides/local-development/cli/config

project_id = "xmall"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
